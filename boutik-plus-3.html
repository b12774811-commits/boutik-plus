<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boutik+ — Elegance Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }

  /* ---------- Variables partagées ---------- */
  :root {
    --bg: #1E1721; --surface: #271D2B; --surface-hi: #322639;
    --ink: #F4EEE6; --ink-dim: #C9BFC7; --gold: #C9A24B; --clay: #C1502E;
    --green: #4F9D6E; --wa: #25D366; --danger: #C1502E; --danger-bg: rgba(193,80,46,0.14);
    --hairline: rgba(244,238,230,0.14);
  }
  body { background: var(--bg); color: var(--ink); font-family: 'Work Sans', sans-serif; }

  /* ---------- Barre d'onglets (visible sur toutes les vues) ---------- */
  .nav-bar {
    max-width: 480px; margin: 0 auto; display: flex; border-bottom: 1px solid var(--hairline);
  }
  .nav-bar button {
    flex: 1; background: none; border: none; color: var(--ink-dim); font-family: 'Work Sans', sans-serif;
    font-size: 12px; padding: 13px 0; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .nav-bar button.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* ---------- Vue Boutique (catalogue) ---------- */
  .ebq-root { min-height: 60vh; max-width: 480px; margin: 0 auto; position: relative; padding-bottom: 88px; }
  .ebq-hero { padding: 32px 24px 24px; text-align: center; border-bottom: 1px solid var(--hairline); }
  .ebq-hero .mark { width: 40px; height: 2px; background: var(--gold); margin: 0 auto 18px; }
  .ebq-title { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 30px; margin: 0; }
  .ebq-tagline { color: var(--ink-dim); font-size: 13.5px; margin-top: 8px; }
  .ebq-grid { display: grid; grid-template-columns: 1fr 1fr; }
  .ebq-card { background: var(--bg); padding-bottom: 16px; border-right: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
  .ebq-card:nth-child(2n) { border-right: none; }
  .ebq-photo { width: 100%; aspect-ratio: 4 / 5; object-fit: contain; object-position: center; display: block; background: var(--surface); }
  .ebq-card-body { padding: 12px 14px 0; }
  .ebq-name { font-family: 'Fraunces', serif; font-size: 15px; line-height: 1.3; margin: 0 0 4px; }
  .ebq-price { color: var(--gold); font-size: 13.5px; font-weight: 500; margin: 0 0 10px; }
  .ebq-sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .ebq-size-btn { border: 1px solid var(--hairline); background: transparent; color: var(--ink-dim); font-size: 11.5px; font-family: 'Work Sans', sans-serif; padding: 5px 9px; cursor: pointer; }
  .ebq-size-btn.active { border-color: var(--gold); color: var(--gold); }
  .ebq-add-btn { width: calc(100% - 28px); margin: 0 14px; background: var(--surface-hi); color: var(--ink); border: none; font-family: 'Work Sans', sans-serif; font-size: 12.5px; font-weight: 500; padding: 9px 0; cursor: pointer; }
  .ebq-add-btn:disabled { opacity: 0.4; cursor: default; }
  .ebq-add-btn.added { background: var(--clay); }
  .ebq-cart-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--hairline); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .ebq-cart-bar .left { display: flex; align-items: center; gap: 10px; }
  .ebq-cart-count { background: var(--gold); color: var(--bg); font-size: 11px; font-weight: 600; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .ebq-cart-total { font-size: 14px; font-weight: 500; }
  .ebq-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .ebq-sheet { background: var(--surface); width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto; padding: 22px 22px 26px; }
  .ebq-sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .ebq-sheet-head h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 19px; margin: 0; }
  .ebq-close-btn { background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: 20px; }
  .ebq-item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 13.5px; }
  .ebq-item-meta { color: var(--ink-dim); font-size: 11.5px; margin-top: 2px; }
  .ebq-qty-ctl { display: flex; align-items: center; gap: 10px; }
  .ebq-qty-ctl button { background: var(--surface-hi); border: none; color: var(--ink); width: 22px; height: 22px; cursor: pointer; }
  .ebq-loc-label { font-size: 12.5px; color: var(--ink-dim); margin: 18px 0 8px; }
  .ebq-loc-input { width: 100%; background: var(--bg); border: 1px solid var(--hairline); color: var(--ink); font-family: 'Work Sans', sans-serif; font-size: 13.5px; padding: 10px 12px; }
  .ebq-total-row { display: flex; justify-content: space-between; margin: 18px 0 14px; font-size: 15px; }
  .ebq-total-row .amt { color: var(--gold); font-weight: 600; }
  .ebq-send-btn { width: 100%; background: var(--wa); color: #08210F; border: none; font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 14px; padding: 13px 0; cursor: pointer; }
  .ebq-send-btn:disabled { opacity: 0.4; cursor: default; }
  .ebq-empty { text-align: center; color: var(--ink-dim); font-size: 13px; padding: 30px 0; }

  /* ---------- Vue Tarifs ---------- */
  .pr-root { max-width: 480px; margin: 0 auto; padding: 0 0 60px; }
  .pr-hero { padding: 36px 24px 24px; text-align: center; border-bottom: 1px solid var(--hairline); }
  .pr-hero .mark { width: 40px; height: 2px; background: var(--gold); margin: 0 auto 18px; }
  .pr-hero h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 28px; margin: 0; }
  .pr-hero p { color: var(--ink-dim); font-size: 13.5px; margin-top: 10px; line-height: 1.5; }
  .plan-card { margin: 24px 20px 0; background: var(--surface); border: 1px solid var(--gold); padding: 26px 22px; }
  .plan-name { font-family: 'Fraunces', serif; font-size: 15px; color: var(--gold); letter-spacing: 0.5px; text-transform: uppercase; margin: 0 0 10px; }
  .plan-price { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .plan-price .amount { font-family: 'Fraunces', serif; font-weight: 600; font-size: 36px; }
  .plan-price .period { color: var(--ink-dim); font-size: 13px; }
  .plan-trial { font-size: 12.5px; color: var(--gold); margin-bottom: 20px; }
  .plan-features { list-style: none; padding: 0; margin: 0 0 22px; }
  .plan-features li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .plan-features li:last-child { border-bottom: none; }
  .plan-features .check { color: var(--gold); flex-shrink: 0; }
  .cta-btn { display: block; width: 100%; text-align: center; text-decoration: none; background: var(--wa); color: #08210F; font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 14px; padding: 14px 0; box-sizing: border-box; }
  .cta-sub { text-align: center; font-size: 11px; color: var(--ink-dim); margin-top: 10px; }
  .pr-section { padding: 30px 24px 0; }
  .pr-section h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 16px; margin: 0 0 14px; }
  .faq-item { border-bottom: 1px solid var(--hairline); padding: 13px 0; }
  .faq-item .q { font-size: 13px; font-weight: 500; margin-bottom: 5px; }
  .faq-item .a { font-size: 12px; color: var(--ink-dim); line-height: 1.6; }
  .launch-banner { margin: 24px 20px 0; background: rgba(201,162,75,0.12); border: 1px dashed var(--gold); padding: 13px 15px; font-size: 11.5px; color: var(--gold); text-align: center; }

  /* ---------- Vue Tableau de bord ---------- */
  .adm-root { max-width: 480px; margin: 0 auto; padding: 28px 20px 60px; }
  .adm-root h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; margin: 0 0 4px; }
  .adm-root .subtitle { color: var(--ink-dim); font-size: 12.5px; margin: 0 0 18px; }
  .card { background: var(--surface); border: 1px solid var(--hairline); padding: 18px; margin-bottom: 16px; }
  .adm-root label { display: block; font-size: 12px; color: var(--ink-dim); margin: 12px 0 5px; }
  .adm-root label:first-of-type { margin-top: 0; }
  .adm-root input { width: 100%; background: var(--bg); border: 1px solid var(--hairline); color: var(--ink); font-family: 'Work Sans', sans-serif; font-size: 13.5px; padding: 9px 11px; }
  .photo-picker {
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: var(--bg); border: 1px dashed var(--hairline); color: var(--ink-dim);
    font-size: 12.5px; min-height: 90px; margin-top: 0; text-align: center; padding: 10px;
  }
  .photo-picker img { max-height: 140px; max-width: 100%; object-fit: contain; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: none; font-family: 'Work Sans', sans-serif; font-weight: 500; font-size: 13px; padding: 10px 16px; cursor: pointer; }
  .btn-primary { background: var(--gold); color: var(--bg); margin-top: 14px; width: 100%; }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); font-size: 11.5px; padding: 6px 10px; }
  .btn-ghost { background: var(--surface-hi); color: var(--ink); font-size: 11.5px; padding: 6px 10px; }
  .btn-ghost-full { background: transparent; border: 1px solid var(--hairline); color: var(--ink-dim); width: 100%; padding: 11px 0; margin-bottom: 12px; }
  .btn-reset-full { background: transparent; border: 1px solid var(--danger); color: var(--danger); width: 100%; padding: 11px 0; }
  .live-benef { display: flex; justify-content: space-between; align-items: center; background: rgba(201,162,75,0.12); padding: 8px 11px; margin: 12px 0 2px; font-size: 12.5px; }
  .live-benef .val { font-weight: 600; color: var(--gold); }
  .hero-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .hero-box { flex: 1; background: var(--surface); border: 1px solid var(--hairline); padding: 14px 16px; }
  .hero-label { font-size: 11px; color: var(--ink-dim); margin-bottom: 6px; }
  .hero-value { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; color: var(--green); }
  .hero-value.gold { color: var(--gold); }
  .hero-value.small { font-size: 17px; }
  .hero-value.neg { color: var(--danger); }
  .alert-banner { background: var(--danger-bg); color: var(--danger); padding: 10px 13px; font-size: 12.5px; margin-bottom: 16px; }
  .stats-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .stats-tabs button { flex: 1; padding: 8px 2px; font-size: 11px; background: var(--surface); color: var(--ink-dim); border: 1px solid var(--hairline); cursor: pointer; font-family: 'Work Sans', sans-serif; }
  .stats-tabs button.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { background: var(--surface); border: 1px solid var(--hairline); padding: 12px; }
  .stat-card .label { font-size: 11px; color: var(--ink-dim); margin-bottom: 4px; }
  .stat-card .value { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15.5px; }
  .stat-card .sub { font-size: 10.5px; color: var(--ink-dim); margin-top: 2px; }
  .section-title { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; font-family: 'Fraunces', serif; }
  .section-title .count { font-family: 'Work Sans', sans-serif; font-size: 11.5px; color: var(--ink-dim); font-weight: 400; }
  .badge-low { display: inline-block; background: var(--danger-bg); color: var(--danger); font-size: 9.5px; padding: 2px 7px; margin-left: 6px; white-space: nowrap; }
  .stock-row { border-bottom: 1px solid var(--hairline); padding: 12px 0; }
  .stock-row:last-child { border-bottom: none; }
  .stock-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .stock-name { font-family: 'Fraunces', serif; font-size: 14px; }
  .stock-qty { font-size: 11px; color: var(--ink-dim); white-space: nowrap; }
  .stock-mid { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-dim); margin-top: 4px; }
  .stock-mid .benef { color: var(--green); }
  .stock-actions { display: flex; gap: 8px; margin-top: 10px; }
  .stock-actions .btn { flex: 1; padding: 8px 0; font-size: 11.5px; }
  .sell-panel { margin-top: 10px; padding: 11px; background: var(--bg); border: 1px solid var(--hairline); }
  .sell-panel .row2 { margin-bottom: 8px; }
  .error-text { color: var(--danger); font-size: 11.5px; margin-top: 6px; }
  .sale-row { border-bottom: 1px solid var(--hairline); padding: 9px 0; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
  .sale-row:last-child { border-bottom: none; }
  .sale-name { font-family: 'Fraunces', serif; font-size: 13px; }
  .sale-date { color: var(--ink-dim); font-size: 10.5px; }
  .sale-right { text-align: right; }
  .sale-benef { color: var(--green); font-weight: 500; }
  .empty { color: var(--ink-dim); font-size: 12.5px; text-align: center; padding: 16px 0; }
  .gate { max-width: 320px; margin: 60px auto; text-align: center; }
  .gate input { margin-top: 14px; }
  .gate .btn-primary { margin-top: 14px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// -----------------------------------------------------------------
// COLLE ICI la config Firebase de ton projet (une seule config pour
// tout le fichier : boutique, tableau de bord et tarifs).
// ⚠️ Pour l'upload de photo, active aussi "Storage" dans la console
// Firebase (menu de gauche → Build → Storage → Get started).
// -----------------------------------------------------------------
const firebaseConfig = {
  apiKey: "VOTRE_API_KEY",
  authDomain: "VOTRE_PROJET.firebaseapp.com",
  projectId: "VOTRE_PROJET",
  storageBucket: "VOTRE_PROJET.appspot.com",
  messagingSenderId: "VOTRE_SENDER_ID",
  appId: "VOTRE_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

const MERCHANT = { name: "Elegance Boutique", tagline: "Prêt-à-porter féminin — Abidjan", whatsapp: "2250708769021" };
const ADMIN_PASSWORD = "changez-moi";
const LOW_STOCK = 3;

function fmt(n) { n = Math.round(Number(n) || 0); return n.toLocaleString("fr-FR") + " FCFA"; }
function startOfWeek(date) { const d = new Date(date); const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day; d.setDate(d.getDate() + diff); d.setHours(0,0,0,0); return d; }
function inPeriod(iso, period) {
  const d = new Date(iso); const now = new Date();
  if (period === "jour") return d.toDateString() === now.toDateString();
  if (period === "semaine") return startOfWeek(d).getTime() === startOfWeek(now).getTime();
  if (period === "mois") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  return true;
}
function dateFr(iso) { const d = new Date(iso); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}) + " " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function csvField(val) { const s = String(val); if (s.includes(",")||s.includes('"')||s.includes("\n")) return '"'+s.replace(/"/g,'""')+'"'; return s; }
function exportCSV(ventes) {
  const header = ["Date","Produit","Quantite","Prix achat","Prix vente","Benefice"];
  const rows = ventes.map((v) => [dateFr(v.date), v.produitNom, v.qte, v.achat, v.prixVente, v.benefice]);
  const totalBenefice = ventes.reduce((s,v) => s+v.benefice, 0);
  const csv = [header.map(csvField).join(",")].concat(rows.map((r)=>r.map(csvField).join(","))).concat(["",["","","","","TOTAL",totalBenefice].map(csvField).join(",")]).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = "ventes-elegance-boutique.csv"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function emptyForm() { return { nom: "", achat: "", prix: "", qte: "", tailles: "" }; }

// ===================== VUE 1 : BOUTIQUE (catalogue public) =====================
function VueBoutique() {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedSizes, setSelectedSizes] = useState({});
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [location, setLocation] = useState("");
  const [justAdded, setJustAdded] = useState(null);

  useEffect(() => {
    const unsub = db.collection("produits").orderBy("createdAt","desc").onSnapshot((snap) => {
      setProducts(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return () => unsub();
  }, []);

  const total = useMemo(() => cart.reduce((s,i) => s+i.price*i.qty, 0), [cart]);

  function addToCart(product) {
    const needsSize = (product.tailles || []).length > 0;
    const size = selectedSizes[product.id] || null;
    if (needsSize && !size) return;
    setCart((prev) => {
      const existing = prev.find((i) => i.id === product.id && i.size === size);
      if (existing) return prev.map((i) => i === existing ? {...i, qty: i.qty+1} : i);
      return [...prev, { id: product.id, name: product.nom, price: product.prix, size, qty: 1 }];
    });
    setJustAdded(product.id); setTimeout(() => setJustAdded(null), 1200);
  }
  function changeQty(index, delta) {
    setCart((prev) => { const next=[...prev]; next[index]={...next[index], qty: next[index].qty+delta}; return next.filter((i)=>i.qty>0); });
  }
  function sendOrder() {
    if (cart.length===0 || !location.trim()) return;
    const lines = cart.map((i) => `• ${i.name}${i.size ? ` (taille ${i.size})` : ""} x${i.qty} — ${fmt(i.price*i.qty)}`);
    const message = `Bonjour ${MERCHANT.name}, je souhaite commander :\n\n${lines.join("\n")}\n\nTotal : ${fmt(total)}\nLieu de livraison : ${location.trim()}`;
    window.open(`https://wa.me/${MERCHANT.whatsapp}?text=${encodeURIComponent(message)}`, "_blank");
  }

  return (
    <div className="ebq-root">
      <div className="ebq-hero">
        <div className="mark" />
        <h1 className="ebq-title">{MERCHANT.name}</h1>
        <p className="ebq-tagline">{MERCHANT.tagline}</p>
      </div>
      {loading ? <p className="ebq-empty">Chargement du catalogue…</p>
      : products.length === 0 ? <p className="ebq-empty">Aucun article pour le moment.</p>
      : (
        <div className="ebq-grid">
          {products.map((product) => (
            <div className="ebq-card" key={product.id}>
              <img className="ebq-photo" src={product.photoUrl} alt={product.nom} />
              <div className="ebq-card-body">
                <p className="ebq-name">{product.nom}</p>
                <p className="ebq-price">{fmt(product.prix)}</p>
                <div className="ebq-sizes">
                  {(product.tailles||[]).map((size) => (
                    <button key={size} className={"ebq-size-btn"+(selectedSizes[product.id]===size?" active":"")}
                      onClick={() => setSelectedSizes((p)=>({...p,[product.id]:size}))}>{size}</button>
                  ))}
                </div>
              </div>
              <button className={"ebq-add-btn"+(justAdded===product.id?" added":"")} disabled={(product.tailles||[]).length>0 && !selectedSizes[product.id]} onClick={() => addToCart(product)}>
                {justAdded===product.id ? "Ajouté ✓" : "Ajouter à la commande"}
              </button>
            </div>
          ))}
        </div>
      )}
      {cart.length > 0 && (
        <div className="ebq-cart-bar" onClick={() => setCartOpen(true)}>
          <div className="left">🛍️ <span className="ebq-cart-count">{cart.reduce((n,i)=>n+i.qty,0)}</span></div>
          <span className="ebq-cart-total">{fmt(total)}</span>
        </div>
      )}
      {cartOpen && (
        <div className="ebq-overlay" onClick={() => setCartOpen(false)}>
          <div className="ebq-sheet" onClick={(e)=>e.stopPropagation()}>
            <div className="ebq-sheet-head"><h3>Ma commande</h3><button className="ebq-close-btn" onClick={()=>setCartOpen(false)}>✕</button></div>
            {cart.map((item,index) => (
              <div className="ebq-item-row" key={item.id+item.size}>
                <div><div>{item.name}</div><div className="ebq-item-meta">{item.size ? `Taille ${item.size} · ` : ""}{fmt(item.price)}</div></div>
                <div className="ebq-qty-ctl"><button onClick={()=>changeQty(index,-1)}>−</button>{item.qty}<button onClick={()=>changeQty(index,1)}>+</button></div>
              </div>
            ))}
            <div className="ebq-loc-label">📍 Lieu de livraison</div>
            <input className="ebq-loc-input" placeholder="Ex : Cocody, Angré 8e tranche" value={location} onChange={(e)=>setLocation(e.target.value)} />
            <div className="ebq-total-row"><span>Total</span><span className="amt">{fmt(total)}</span></div>
            <button className="ebq-send-btn" disabled={cart.length===0||!location.trim()} onClick={sendOrder}>Envoyer la commande sur WhatsApp</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ===================== VUE 3 : TABLEAU DE BORD (privé) =====================
function VueAdmin() {
  const [unlocked, setUnlocked] = useState(false);
  const [pwd, setPwd] = useState("");
  const [pwdError, setPwdError] = useState(false);
  const [produits, setProduits] = useState([]);
  const [ventes, setVentes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState(emptyForm());
  const [photoFile, setPhotoFile] = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [formError, setFormError] = useState(false);
  const [openSellId, setOpenSellId] = useState(null);
  const [sellQte, setSellQte] = useState("");
  const [sellPrix, setSellPrix] = useState("");
  const [sellError, setSellError] = useState(false);
  const [statPeriod, setStatPeriod] = useState("jour");

  useEffect(() => {
    if (!unlocked) return;
    const unsub1 = db.collection("produits").orderBy("createdAt","desc").onSnapshot((snap) => { setProduits(snap.docs.map((d)=>({id:d.id,...d.data()}))); setLoading(false); });
    const unsub2 = db.collection("ventes").orderBy("date","desc").onSnapshot((snap) => setVentes(snap.docs.map((d)=>({id:d.id,...d.data()}))));
    return () => { unsub1(); unsub2(); };
  }, [unlocked]);

  function checkPassword() { if (pwd===ADMIN_PASSWORD) { setUnlocked(true); setPwdError(false);} else setPwdError(true); }
  const liveBenef = (Number(form.prix)||0) - (Number(form.achat)||0);

  function handlePhotoChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    setPhotoFile(file);
    setPhotoPreview(URL.createObjectURL(file));
  }

  async function saveProduct() {
    const { nom, achat, prix, qte } = form;
    if (!nom.trim()||!achat||Number(achat)<0||!prix||Number(prix)<0||!qte||Number(qte)<1||!photoFile) { setFormError(true); return; }
    setFormError(false); setSaving(true);
    try {
      setUploading(true);
      const path = `produits/${Date.now()}_${photoFile.name}`;
      const ref = storage.ref(path);
      await ref.put(photoFile);
      const photoUrl = await ref.getDownloadURL();
      setUploading(false);

      await db.collection("produits").add({
        nom: nom.trim(), achat: Number(achat), prix: Number(prix), qte: Number(qte),
        tailles: form.tailles.split(",").map((s)=>s.trim()).filter(Boolean),
        photoUrl, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setForm(emptyForm());
      setPhotoFile(null);
      setPhotoPreview(null);
    } catch (err) {
      setUploading(false);
      alert("Erreur lors de l'envoi de la photo : " + err.message);
    }
    setSaving(false);
  }
  async function deleteProduit(id) { if (!window.confirm("Retirer cet article du catalogue ?")) return; await db.collection("produits").doc(id).delete(); }
  function toggleSell(product) { if (openSellId===product.id) { setOpenSellId(null); return; } setOpenSellId(product.id); setSellQte("1"); setSellPrix(String(product.prix)); setSellError(false); }
  async function confirmSell(product) {
    const qteVendue = Number(sellQte), prixReel = Number(sellPrix);
    if (!qteVendue||qteVendue<1||qteVendue>product.qte||!prixReel||prixReel<0) { setSellError(true); return; }
    setSellError(false);
    const benefice = (prixReel - product.achat) * qteVendue;
    await db.collection("ventes").add({ produitId: product.id, produitNom: product.nom, qte: qteVendue, prixVente: prixReel, achat: product.achat, benefice, date: new Date().toISOString() });
    const restant = product.qte - qteVendue;
    if (restant<=0) await db.collection("produits").doc(product.id).delete();
    else await db.collection("produits").doc(product.id).update({ qte: restant });
    setOpenSellId(null);
  }
  async function resetAll() {
    if (!window.confirm("Supprimer tout le stock et tout l'historique des ventes ? Cette action est définitive.")) return;
    const batch = db.batch();
    (await db.collection("produits").get()).forEach((doc)=>batch.delete(doc.ref));
    (await db.collection("ventes").get()).forEach((doc)=>batch.delete(doc.ref));
    await batch.commit();
  }

  const totalBenef = useMemo(() => ventes.reduce((s,v)=>s+v.benefice,0), [ventes]);
  const potentielStock = useMemo(() => produits.reduce((s,p)=>s+(p.prix-p.achat)*p.qte,0), [produits]);
  const totalQteVendue = useMemo(() => ventes.reduce((s,v)=>s+v.qte,0), [ventes]);
  const lowStockItems = useMemo(() => produits.filter((p)=>p.qte<=LOW_STOCK), [produits]);
  const ventesPeriode = useMemo(() => ventes.filter((v)=>inPeriod(v.date,statPeriod)), [ventes, statPeriod]);
  const benefPeriode = useMemo(() => ventesPeriode.reduce((s,v)=>s+v.benefice,0), [ventesPeriode]);
  const bestSeller = useMemo(() => {
    const q={}; ventesPeriode.forEach((v)=>{q[v.produitNom]=(q[v.produitNom]||0)+v.qte;});
    return Object.entries(q).sort((a,b)=>b[1]-a[1])[0]||null;
  }, [ventesPeriode]);

  if (!unlocked) {
    return (
      <div className="adm-root"><div className="gate">
        <h1>Tableau de bord</h1><p className="subtitle">Elegance Boutique</p>
        <input type="password" placeholder="Mot de passe" value={pwd} onChange={(e)=>setPwd(e.target.value)} onKeyDown={(e)=>e.key==="Enter"&&checkPassword()} />
        <button className="btn btn-primary" onClick={checkPassword}>Entrer</button>
        {pwdError && <p className="error-text">Mot de passe incorrect.</p>}
      </div></div>
    );
  }

  return (
    <div className="adm-root">
      <h1>Tableau de bord</h1>
      <p className="subtitle">Gère ton catalogue, ton stock et tes bénéfices.</p>
      <div className="hero-row">
        <div className="hero-box"><div className="hero-label">Bénéfice réalisé (ventes)</div><div className={"hero-value"+(totalBenef<0?" neg":"")}>{fmt(totalBenef)}</div></div>
        <div className="hero-box"><div className="hero-label">Bénéfice potentiel du stock</div><div className={"hero-value gold"+(potentielStock<0?" neg":"")}>{fmt(potentielStock)}</div></div>
      </div>
      <div className="hero-row">
        <div className="hero-box"><div className="hero-label">Articles vendus</div><div className="hero-value small">{totalQteVendue}</div></div>
        <div className="hero-box"><div className="hero-label">Ventes enregistrées</div><div className="hero-value small">{ventes.length}</div></div>
      </div>
      {lowStockItems.length>0 && (
        <div className="alert-banner">{lowStockItems.length===1 ? `1 produit en stock faible : ${lowStockItems[0].nom}` : `${lowStockItems.length} produits en stock faible : ${lowStockItems.map((p)=>p.nom).join(", ")}`}</div>
      )}
      <div className="card">
        <div className="section-title">Statistiques</div>
        <div className="stats-tabs">
          {[["jour","Jour"],["semaine","Semaine"],["mois","Mois"],["tout","Depuis le début"]].map(([key,label]) => (
            <button key={key} className={statPeriod===key?"active":""} onClick={()=>setStatPeriod(key)}>{label}</button>
          ))}
        </div>
        <div className="stats-grid">
          <div className="stat-card"><div className="label">Bénéfice de la période</div><div className="value">{fmt(benefPeriode)}</div><div className="sub">{ventesPeriode.length} vente(s)</div></div>
          <div className="stat-card"><div className="label">Produit le plus vendu</div><div className="value">{bestSeller?bestSeller[0]:"—"}</div><div className="sub">{bestSeller?`${bestSeller[1]} unité(s) vendue(s)`:"Aucune vente sur la période"}</div></div>
        </div>
      </div>
      <div className="card">
        <div className="section-title">Ajouter un produit</div>
        <label>Nom du produit</label>
        <input value={form.nom} onChange={(e)=>setForm({...form,nom:e.target.value})} placeholder="Ex : Robe Ankara Adjoa" />
        <div className="row2">
          <div><label>Prix d'achat (FCFA)</label><input type="number" value={form.achat} onChange={(e)=>setForm({...form,achat:e.target.value})} placeholder="12000" /></div>
          <div><label>Prix de vente (FCFA)</label><input type="number" value={form.prix} onChange={(e)=>setForm({...form,prix:e.target.value})} placeholder="18500" /></div>
        </div>
        <label>Quantité en stock</label>
        <input type="number" value={form.qte} onChange={(e)=>setForm({...form,qte:e.target.value})} placeholder="5" />
        <div className="live-benef"><span>Bénéfice par unité</span><span className="val">{fmt(liveBenef)}</span></div>
        <label>Tailles disponibles (séparées par des virgules)</label>
        <input value={form.tailles} onChange={(e)=>setForm({...form,tailles:e.target.value})} placeholder="Ex : S, M, L, XL" />
        <label>Photo du produit</label>
        <label className="photo-picker">
          {photoPreview ? <img src={photoPreview} alt="Aperçu" /> : <span>📷 Choisir une photo depuis le téléphone</span>}
          <input type="file" accept="image/*" onChange={handlePhotoChange} style={{ display: "none" }} />
        </label>
        {formError && <p className="error-text">Remplis tous les champs et choisis une photo.</p>}
        <button className="btn btn-primary" disabled={saving} onClick={saveProduct}>
          {uploading ? "Envoi de la photo…" : saving ? "Enregistrement…" : "Ajouter au stock"}
        </button>
      </div>
      <div className="card">
        <div className="section-title">Mon stock <span className="count">({produits.length})</span></div>
        {loading ? <p className="empty">Chargement…</p>
        : produits.length===0 ? <p className="empty">Aucun article pour l'instant.</p>
        : produits.map((p) => {
            const benefUnit = p.prix - p.achat, benefPotentiel = benefUnit*p.qte, sellOpen = openSellId===p.id;
            return (
              <div className="stock-row" key={p.id}>
                <div className="stock-top"><span className="stock-name">{p.nom}</span><span className="stock-qty">{p.qte} en stock{p.qte<=LOW_STOCK && <span className="badge-low">Stock faible</span>}</span></div>
                <div className="stock-mid"><span>Achat {fmt(p.achat)} → Vente {fmt(p.prix)}</span><span className="benef">+{fmt(benefUnit)}/u</span></div>
                <div className="stock-mid"><span>Bénéfice potentiel du lot</span><span className="benef">{fmt(benefPotentiel)}</span></div>
                <div className="stock-actions">
                  <button className="btn btn-ghost" onClick={()=>toggleSell(p)}>{sellOpen?"Annuler":"Enregistrer une vente"}</button>
                  <button className="btn btn-danger" onClick={()=>deleteProduit(p.id)}>Retirer</button>
                </div>
                {sellOpen && (
                  <div className="sell-panel">
                    <div className="row2">
                      <div><label>Quantité vendue</label><input type="number" min="1" max={p.qte} value={sellQte} onChange={(e)=>setSellQte(e.target.value)} /></div>
                      <div><label>Prix de vente réel</label><input type="number" min="0" value={sellPrix} onChange={(e)=>setSellPrix(e.target.value)} /></div>
                    </div>
                    {sellError && <p className="error-text">Vérifie la quantité (max {p.qte}) et le prix.</p>}
                    <button className="btn btn-primary" style={{marginTop:4}} onClick={()=>confirmSell(p)}>Confirmer la vente</button>
                  </div>
                )}
              </div>
            );
        })}
      </div>
      <div className="card">
        <div className="section-title">Historique des ventes <span className="count">({ventes.length})</span></div>
        {ventes.length===0 ? <p className="empty">Aucune vente enregistrée pour le moment.</p>
        : ventes.slice(0,30).map((v) => (
            <div className="sale-row" key={v.id}>
              <div><div className="sale-name">{v.produitNom} × {v.qte}</div><div className="sale-date">{dateFr(v.date)}</div></div>
              <div className="sale-right"><div>{fmt(v.prixVente)}/u</div><div className="sale-benef">+{fmt(v.benefice)}</div></div>
            </div>
        ))}
      </div>
      <button className="btn btn-ghost-full" onClick={()=>exportCSV(ventes)}>Exporter mes ventes (CSV)</button>
      <button className="btn btn-reset-full" onClick={resetAll}>Tout réinitialiser (stock et ventes)</button>
    </div>
  );
}

// ===================== APP (un seul fichier, 3 vues) =====================
function getViewFromHash() {
  const h = window.location.hash.replace("#","");
  if (h === "tarifs") return "tarifs";
  if (h === "admin") return "admin";
  return "boutique";
}

function App() {
  const [view, setView] = useState(getViewFromHash());
  useEffect(() => {
    const onHash = () => setView(getViewFromHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  function go(v) { window.location.hash = v === "boutique" ? "" : v; setView(v); }

  return (
    <div>
      <div className="nav-bar">
        <button className={view==="boutique"?"active":""} onClick={()=>go("boutique")}>Boutique</button>
        <button className={view==="tarifs"?"active":""} onClick={()=>go("tarifs")}>Tarifs</button>
        <button className={view==="admin"?"active":""} onClick={()=>go("admin")}>Tableau de bord</button>
      </div>
      {view==="boutique" && <VueBoutique />}
      {view==="tarifs" && <VueTarifs />}
      {view==="admin" && <VueAdmin />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
